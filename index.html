<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vikas Gaurav — Product Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #16161f;
      --card: #1a1a26;
      --border: #2a2a3a;
      --accent: #e8ff47;
      --accent2: #7b61ff;
      --accent3: #ff6b6b;
      --text: #f0f0f8;
      --muted: #8888aa;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s ease, opacity 0.2s ease;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9998;
      transition: all 0.25s ease;
      opacity: 0.5;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.35;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 4rem;
      backdrop-filter: blur(16px);
      background: rgba(10,10,15,0.85);
      border-bottom: 1px solid var(--border);
      transition: all 0.3s;
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1.5px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 4rem 4rem;
      position: relative;
      overflow: hidden;
    }

    .hero-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .hero-blob {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      animation: blobFloat 8s ease-in-out infinite;
    }
    .hero-blob-1 {
      background: radial-gradient(circle, rgba(123,97,255,0.18) 0%, transparent 70%);
      top: -100px; right: -100px;
    }
    .hero-blob-2 {
      background: radial-gradient(circle, rgba(232,255,71,0.1) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      animation-delay: -4s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(30px,-30px) scale(1.05); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(232,255,71,0.08);
      border: 1px solid rgba(232,255,71,0.25);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 2rem;
      width: fit-content;
      animation: fadeSlideUp 0.6s ease both;
    }

    .pulse-dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.4; transform:scale(0.7); }
    }

    .hero-name {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(3.5rem, 9vw, 8rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      animation: fadeSlideUp 0.6s 0.1s ease both;
    }

    .hero-name .accent { color: var(--accent); }

    .hero-tagline {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: var(--muted);
      font-weight: 300;
      max-width: 540px;
      line-height: 1.6;
      animation: fadeSlideUp 0.6s 0.2s ease both;
    }

    .hero-tagline strong { color: var(--text); font-weight: 500; }

    .hero-ctas {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      animation: fadeSlideUp 0.6s 0.3s ease both;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #0a0a0f;
      padding: 0.85rem 2rem;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      font-family: var(--font-head);
      letter-spacing: 0.02em;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232,255,71,0.35);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--text);
      padding: 0.85rem 2rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .hero-scroll {
      margin-top: 4rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: fadeSlideUp 0.6s 0.5s ease both;
    }
    .scroll-line {
      width: 40px; height: 1px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }
    .scroll-line::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--accent);
      animation: scanLine 2s ease infinite;
    }
    @keyframes scanLine { 0% { left:-100%; } 100% { left:100%; } }

    /* SECTIONS */
    section {
      padding: 6rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .section-label::before {
      content: '';
      display: block;
      width: 24px; height: 1.5px;
      background: var(--accent);
    }

    .section-title {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 3rem;
    }

    /* ABOUT */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .about-text p {
      color: var(--muted);
      margin-bottom: 1.2rem;
      font-size: 1.05rem;
      line-height: 1.8;
    }
    .about-text p strong { color: var(--text); }

    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s, border-color 0.25s;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.3s;
      transform-origin: left;
    }
    .stat-card:hover::before { transform: scaleX(1); }

    .stat-number {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.3rem;
      font-weight: 400;
    }

    /* EXPERIENCE */
    .exp-timeline {
      position: relative;
      padding-left: 2rem;
    }
    .exp-timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 1px;
      background: var(--border);
    }

    .exp-item {
      position: relative;
      margin-bottom: 3rem;
      padding-left: 2rem;
    }
    .exp-item::before {
      content: '';
      position: absolute;
      left: -2rem;
      top: 6px;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 4px rgba(232,255,71,0.15);
    }

    .exp-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .exp-company {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.2rem;
    }

    .exp-tag {
      display: inline-block;
      background: rgba(123,97,255,0.15);
      border: 1px solid rgba(123,97,255,0.3);
      color: #b8a8ff;
      border-radius: 100px;
      padding: 0.2rem 0.75rem;
      font-size: 0.73rem;
      font-weight: 500;
    }

    .exp-title-line {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }
    .exp-title-line strong { color: var(--text); }

    .exp-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .exp-bullets li {
      display: flex;
      gap: 0.75rem;
      font-size: 0.93rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .exp-bullets li::before {
      content: '→';
      color: var(--accent);
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    /* CASE STUDIES */
    .case-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      cursor: default;
      position: relative;
      overflow: hidden;
    }
    .case-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,255,71,0.03) 0%, transparent 60%);
      pointer-events: none;
    }
    .case-card:hover {
      transform: translateY(-6px);
      border-color: rgba(232,255,71,0.3);
      box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(232,255,71,0.1);
    }

    .case-emoji {
      font-size: 2.5rem;
      margin-bottom: 1.2rem;
      display: block;
    }

    .case-title {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .case-section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      margin-top: 1.2rem;
      margin-bottom: 0.4rem;
    }

    .case-text {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .case-outcome {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(232,255,71,0.08);
      border: 1px solid rgba(232,255,71,0.2);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 500;
      margin-top: 1.2rem;
    }

    /* SKILLS */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .skill-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      transition: transform 0.25s, border-color 0.25s;
    }
    .skill-group:hover {
      transform: translateY(-3px);
      border-color: rgba(123,97,255,0.4);
    }

    .skill-group-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.3rem 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
      transition: all 0.2s;
    }
    .chip:hover {
      background: rgba(232,255,71,0.08);
      border-color: rgba(232,255,71,0.3);
      color: var(--accent);
    }

    /* EDUCATION */
    .edu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .edu-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s, border-color 0.25s;
    }
    .edu-card:hover {
      transform: translateY(-4px);
      border-color: rgba(232,255,71,0.3);
    }

    .edu-card-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .edu-degree {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
    }
    .edu-inst { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.3rem; }
    .edu-year { color: var(--accent); font-size: 0.82rem; font-weight: 600; }
    .edu-grade { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }

    /* HOBBIES */
    .hobbies-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .hobby-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      transition: transform 0.3s, border-color 0.3s;
      cursor: default;
    }
    .hobby-card:hover {
      transform: translateY(-6px) rotate(-1deg);
      border-color: var(--accent);
    }

    .hobby-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .hobby-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .hobby-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

    /* FUN CRICKET WIDGET */
    .cricket-widget {
      background: linear-gradient(135deg, #1a2a1a, #1a1a2a);
      border: 1px solid rgba(232,255,71,0.2);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .cricket-fact { font-size: 0.88rem; color: var(--muted); }
    .cricket-fact strong { color: var(--accent); }

    /* CONTACT */
    .contact-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .contact-text h2 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .contact-text p {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, border-color 0.2s;
      font-size: 0.92rem;
    }
    .contact-link:hover {
      transform: translateX(6px);
      border-color: var(--accent);
    }
    .contact-link-icon {
      width: 40px; height: 40px;
      background: rgba(232,255,71,0.08);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .contact-link-label { color: var(--muted); font-size: 0.75rem; }
    .contact-link-val { font-weight: 500; }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.82rem;
      max-width: 100%;
    }

    /* ANIMATIONS */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* SEPARATOR */
    .section-sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 4rem;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      section { padding: 4rem 1.5rem; }
      .hero { padding: 7rem 1.5rem 3rem; }
      .about-grid, .edu-grid, .contact-inner { grid-template-columns: 1fr; gap: 2rem; }
      .hobbies-grid { grid-template-columns: 1fr 1fr; }
      footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
      .section-sep { margin: 0 1.5rem; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Cursor
    function Cursor() {
      const dot = useRef(null);
      const ring = useRef(null);

      useEffect(() => {
        let mx = 0, my = 0;
        let rx = 0, ry = 0;
        let raf;

        const move = (e) => { mx = e.clientX; my = e.clientY; };
        window.addEventListener('mousemove', move);

        const animate = () => {
          rx += (mx - rx) * 0.18;
          ry += (my - ry) * 0.18;
          if (dot.current) {
            dot.current.style.transform = `translate(${mx - 6}px, ${my - 6}px)`;
          }
          if (ring.current) {
            ring.current.style.transform = `translate(${rx - 18}px, ${ry - 18}px)`;
          }
          raf = requestAnimationFrame(animate);
        };
        animate();
        return () => { window.removeEventListener('mousemove', move); cancelAnimationFrame(raf); };
      }, []);

      return (
        <>
          <div className="cursor" ref={dot}></div>
          <div className="cursor-ring" ref={ring}></div>
        </>
      );
    }

    // Fade-in on scroll
    function useFadeIn() {
      useEffect(() => {
        const els = document.querySelectorAll('.fade-in');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
        }, { threshold: 0.1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    // Animated counter
    function Counter({ target, suffix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      useEffect(() => {
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            let start = 0;
            const step = Math.ceil(target / 40);
            const t = setInterval(() => {
              start += step;
              if (start >= target) { setVal(target); clearInterval(t); }
              else setVal(start);
            }, 40);
            obs.disconnect();
          }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, [target]);
      return <span ref={ref}>{val}{suffix}</span>;
    }
